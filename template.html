<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>{{TITLE}}</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reset.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/black.css" id="theme" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/monokai.css" />

  <style>
    :root {
      --r-heading-font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --r-main-font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --r-code-font: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    }
    /* Safety net: any slide can still scroll if content somehow overflows the
       flex layout below. Without a height bound, `overflow-y: auto` is a no-op —
       reveal sizes sections to content and clips at the virtual-slide boundary. */
    .reveal .slides section {
      max-height: 96vh;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .reveal .slides section::-webkit-scrollbar { width: 8px; }
    .reveal .slides section::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.18);
      border-radius: 4px;
    }
    /* Fit-by-construction: leaf slides (reveal marks vertical-stack wrappers
       with `.stack`, so `:not(.stack)` is every real slide) become a flex
       column. Title / loc / narrative are pinned; the code (or diagram) is the
       single flexible region that shrinks and scrolls inside the slide. Result:
       the slide never exceeds the canvas, and only the code box scrolls — never
       the whole slide. `min-height: 0` is what lets the flex child shrink below
       its content so the inner scroll engages. */
    .reveal .slides section:not(.stack) {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .reveal .slides section:not(.stack) > h2,
    .reveal .slides section:not(.stack) > h1,
    .reveal .slides section:not(.stack) > .loc,
    .reveal .slides section:not(.stack) > .narrative {
      flex: 0 0 auto;
    }
    .reveal .slides section:not(.stack) > pre {
      flex: 1 1 auto;
      min-height: 0;
    }
    .reveal .slides section:not(.stack) > pre code { max-height: 100%; }
    /* Reveal's default theme auto-uppercases H1/H2 and sizes them ~2.5em,
       which wastes a third of the slide on a title. Override globally. */
    .reveal h1, .reveal h2, .reveal h3 { text-transform: none; }
    .reveal h1 { font-size: 1.6em; }
    .reveal h2 { font-weight: 600; letter-spacing: -0.01em; margin-bottom: 0.15em; font-size: 1.1em; line-height: 1.15; }
    .reveal .loc { font-size: 0.46em; opacity: 0.7; margin-top: -0.2em; margin-bottom: 0.4em; }
    .reveal .loc a { color: #8ab4f8; text-decoration: none; border-bottom: 1px dotted #8ab4f8; }
    .reveal .loc a:hover { opacity: 1; border-bottom-style: solid; }
    .reveal pre {
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      border-radius: 6px;
      font-size: 0.38em;
      line-height: 1.35;
    }
    /* Let code grow on the slide rather than scroll inside its own box (the
       double-scroll trap). Pair with tight snippets — see SKILL.md. */
    .reveal pre code { padding: 0.8em 1.1em; max-height: 64vh; }
    .reveal .narrative {
      font-size: 0.5em;
      max-width: 80%;
      margin: 0.6em auto 0;
      text-align: left;
      line-height: 1.5;
      opacity: 0.9;
    }
    .reveal .narrative p { margin: 0.3em 0; }
    .reveal .narrative code {
      background: rgba(255,255,255,0.08);
      padding: 0.1em 0.4em;
      border-radius: 3px;
      font-size: 0.95em;
    }
    .reveal pre.mermaid {
      box-shadow: none;
      background: transparent;
      font-size: 1em;
      width: 100%;
      max-height: 55vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: zoom-in;
      position: relative;
    }
    .reveal pre.mermaid svg { max-width: 100%; max-height: 55vh; height: auto; }
    .reveal pre.mermaid::after {
      content: "click to zoom";
      position: absolute;
      bottom: 0.3em;
      right: 0.6em;
      font-size: 0.35em;
      opacity: 0;
      transition: opacity 120ms;
      pointer-events: none;
      font-family: var(--r-main-font);
      background: rgba(0,0,0,0.55);
      padding: 0.2em 0.5em;
      border-radius: 3px;
    }
    .reveal pre.mermaid:hover::after { opacity: 0.85; }
    .reveal pre.mermaid.mermaid-error {
      border: 2px solid #e06c75;
      background: rgba(224, 108, 117, 0.08);
      cursor: not-allowed;
      min-height: 4em;
      padding-top: 1.6em;
    }
    .reveal pre.mermaid.mermaid-error::before {
      content: "⚠ mermaid syntax error — check browser console for the bad token";
      position: absolute;
      top: 0.4em;
      left: 0.6em;
      color: #e06c75;
      font-size: 0.4em;
      font-family: var(--r-main-font);
      pointer-events: none;
    }
    .reveal pre.mermaid.mermaid-error::after { display: none; }

    #zoom-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 3vh 3vw;
      cursor: zoom-out;
    }
    #zoom-overlay.open { display: flex; }
    #zoom-overlay svg {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
    }
    #zoom-overlay .hint {
      position: fixed;
      bottom: 1em;
      right: 1.2em;
      color: rgba(255,255,255,0.5);
      font-family: var(--r-main-font);
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section>
        <h1>{{TITLE}}</h1>
        <p style="opacity:0.6;font-size:0.6em;margin-top:2em;">
          arrows / <kbd>space</kbd> — advance &nbsp;·&nbsp;
          <kbd>esc</kbd> — overview &nbsp;·&nbsp;
          <kbd>s</kbd> — speaker notes
        </p>
      </section>

      {{SLIDES}}
    </div>
  </div>

  <div id="zoom-overlay" aria-hidden="true">
    <span class="hint">esc / click to close</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/notes/notes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/markdown/markdown.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      securityLevel: 'loose',
      flowchart: { curve: 'basis' },
      themeVariables: { fontFamily: '-apple-system, BlinkMacSystemFont, system-ui, sans-serif' },
    });

    const overlay = document.getElementById('zoom-overlay');

    function openZoom(svg) {
      const clone = svg.cloneNode(true);
      clone.removeAttribute('style');
      clone.style.maxWidth = '100%';
      clone.style.maxHeight = '100%';
      [...overlay.querySelectorAll('svg')].forEach((n) => n.remove());
      overlay.insertBefore(clone, overlay.firstChild);
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
    }

    function closeZoom() {
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
    }

    overlay.addEventListener('click', closeZoom);
    // capture phase so esc closes zoom before reveal.js's overview handler fires
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('open')) {
        e.stopPropagation();
        closeZoom();
      }
    }, true);

    function markErrors(container) {
      // mermaid's parse-error renderer injects an SVG with aria-roledescription="error"
      // (the bomb-icon UI). Tag the host so CSS can flag it loudly.
      container.querySelectorAll('pre.mermaid svg[aria-roledescription="error"]').forEach((svg) => {
        svg.closest('pre.mermaid')?.classList.add('mermaid-error');
      });
    }

    function wireZoom(container) {
      container.querySelectorAll('pre.mermaid:not(.mermaid-error) svg:not([data-zoom-wired])').forEach((svg) => {
        svg.setAttribute('data-zoom-wired', 'true');
        const host = svg.closest('pre.mermaid');
        host.addEventListener('click', (e) => {
          e.stopPropagation();
          openZoom(svg);
        });
      });
    }

    function renderActiveDiagrams() {
      const slides = document.querySelectorAll('.reveal .slides section.present');
      slides.forEach((slide) => {
        const pending = slide.querySelectorAll('pre.mermaid:not([data-processed="true"])');
        const finish = () => { markErrors(slide); wireZoom(slide); };
        if (pending.length) {
          mermaid.run({ nodes: pending, suppressErrors: true }).then(finish).catch(finish);
        } else {
          finish();
        }
      });
    }

    Reveal.initialize({
      hash: true,
      slideNumber: 'c/t',
      transition: 'slide',
      controls: true,
      progress: true,
      center: false,
      plugins: [RevealHighlight, RevealNotes, RevealMarkdown],
    }).then(() => {
      Reveal.on('slidechanged', renderActiveDiagrams);
      renderActiveDiagrams();
    });
  </script>
</body>
</html>
